server
{
    listen 127.0.0.0:8080;
    listen 127.0.0.0:8008;
    listen localhost:8080;
    
    client_max_body_size 10M;
    root /var/www/html;
    error_page 404 /errors/404.html;
    error_page 500 502 503 /errors/50x.html;
    
    location /{
    	root /var/www/html;
        index index.html index1.htm;
        allow_methods GET POST;
        autoindex off;
    }
    
    location /uploads {
        root /var/www/uploads;
        allow_methods GET POST;
        client_max_body_size 50M;
        upload_enable on;
    }
    
    location /redirect {
        redirect 301 /new-location;
    }
 
    location /cgi-bin
	{
        root /var/www/cgi;
        cgi_pass .php /usr/bin/php-cgi;
        cgi_pass .py /usr/bin/python3;
        allow_methods GET POST;
    }
    
    location /images {
        root /var/www/static;
        autoindex on;
    }
}

server
{
	listen localhost:4040;
}

