server
{
    listen 0.0.0.0:8000;
    
    client_max_body_size 10M;
    root /var/www/html;
    error_page 404 /errors/404.html;
    error_page 500 502 503 /errors/50x.html;
    
    location /{
    	root html;
        index index.html;
        allow_methods GET POST DELETE;
        autoindex on;
        upload_enable on;
    }
    
    location /file{
    	root h0;
        index a;
        allow_methods GET POST;
        autoindex on;
        upload_enable on;
    }

    location /uploads {
        root /var/www/uploads;
        allow_methods GET POST;
        client_max_body_size 50M;
        upload_enable on;
    }
    
    location /redirect {
        redirect 300 hh;
    }
 
    location /cgi-bin
	{
        root /var/www/cgi;
        cgi_pass .php /usr/bin/php-cgi;
        cgi_pass .py /usr/bin/python3;
        allow_methods GET POST;
    }
    
    location /images {
        root /var/www/static;
        autoindex on;
    }
}

