server
{
    listen 0.0.0.0:8000;
    
    client_max_body_size 10G;
    root /var/www/html;
    error_page 404 ./errors/404.html;
    error_page 301 ./errors/301.html;
    error_page 403 ./errors/403.html;
    error_page 413 ./errors/413.html;
    error_page 500 ./errors/500.html;
    error_page 504 ./errors/504.html;
	
    
    location /{
    	root html;
        index index.html;
        allow_methods GET POST DELETE;
        autoindex on;
        upload_enable on;
    }
    
    location /file{
    	root html1;
        index a;
        allow_methods GET POST;
        autoindex on;
        upload_enable on;
    }

    location /f {
    	root html/f ;
        index index1.html;
        allow_methods GET POST;
        autoindex on;
        upload_enable on;
    }

    location /uploads {
        root uploads;
        allow_methods GET POST DELETE;
        upload_enable on;
    }
    
    location /redirect {
        redirect 300 hh;
    }
	
    location /cgi
	{
        root cgi;
        cgi_pass .php /usr/bin/php-cgi;
        cgi_pass .py /usr/bin/python3;
        allow_methods GET POST;
    }
}
server{}