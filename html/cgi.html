<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Upload Form</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url("1.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: white;
}

.card {
    width: 420px;
    padding: 35px;
    border-radius: 16px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    color: white;
    display: flex;
    flex-direction: column;
}

.card h2 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
    font-size: 1.8rem;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

.input-group {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
}

.input-group input,
.input-group textarea {
    width: 100%;
    padding: 12px 15px;
    border: none;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
    background: rgba(255,255,255,0.1);
    color: white;
    transition: 0.3s;
}

.input-group input::placeholder,
.input-group textarea::placeholder {
    color: rgba(255,255,255,0.7);
}

.input-group input:focus,
.input-group textarea:focus {
    background: rgba(255,255,255,0.2);
    box-shadow: 0 0 8px rgba(255,255,255,0.3);
}

textarea {
    resize: none;
    height: 80px;
}

.file-input {
    margin-bottom: 20px;
    display: flex;
    align-items: center;
}

.file-input label {
    padding: 10px 15px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    font-size: 14px;
}

.file-input label:hover {
    background: rgba(255,255,255,0.35);
}

.file-input input {
    display: none;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
    background: #ffffff;
    color: #333;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

small {
    opacity: 0.8;
    display: block;
    margin-top: 5px;
}

@media (max-width: 480px) {
    .card {
        width: 90%;
        padding: 25px;
    }
}
</style>
</head>

<body>

<div class="card">
    <h2>Upload Form</h2>
    <form action="/cgi/post.php" method="POST" enctype="multipart/form-data">

        <div class="input-group">
            <input type="text" name="name" placeholder="Name" required>
        </div>

        <div class="input-group">
            <input type="text" name="age" placeholder="Age" required>
        </div>

        <button type="submit">Send Data</button>
    </form>
</div>

</body>
</html>
