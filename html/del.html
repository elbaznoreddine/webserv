<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DELETE Request Tester</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI, sans-serif;
}

body{
    min-height:100vh;

    background:
        /* linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
        url("1.jpg"); */
        background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;
}
.card{
    width:420px;
    padding:35px;
    border-radius:16px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    color:white;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:15px;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:white;
    color:#333;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

pre{
    margin-top:15px;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:8px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<h2>DELETE Request Tester</h2>

<input id="path" placeholder="Enter path (example: /a)">
<button onclick="sendDelete()">Send DELETE</button>

<pre id="result"></pre>

</div>

<script>
async function sendDelete() {
    const path = document.getElementById("path").value || "/a";

    try {
        const res = await fetch(path, {
            method: "DELETE"
        });

        const text = await res.text();
        document.getElementById("result").textContent =
            "Status: " + res.status + "\n\n" + text;

    } catch(e) {
        document.getElementById("result").textContent = e;
    }
}
</script>

</body>
</html>
