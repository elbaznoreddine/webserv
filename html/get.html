<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirect to File</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#3a7bd5,#00d2ff);
        background:
        /* linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
        url("1.jpg"); */
        background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.card{
    width:420px;
    padding:35px;
    border-radius:16px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    color:white;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:15px;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:white;
    color:#333;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}
</style>
</head>

<body>

<div class="card">

<h2>Redirect to File</h2>

<input id="path" placeholder="Enter path (example: /index.html)">

<button onclick="redirect()">Go</button>

</div>

<script>
function redirect(){
    const path = document.getElementById("path").value || "/";
    window.location.href = path;
}
</script>

</body>
</html>
