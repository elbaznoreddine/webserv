<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Web Tester Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI, sans-serif;
}

body{
    min-height:100vh;
    background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
        url("1.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    color:white;
}

h1{
    margin-bottom:40px;
    font-size:36px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,200px);
    gap:25px;
    justify-content:center;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:15px;
    text-decoration:none;
    color:white;
    font-size:18px;
    transition:0.3s;
    box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

.card:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,0.25);
}

.footer{
    margin-top:35px;
    opacity:0.8;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>Web Testing Dashboard</h1>

<div class="grid">

<a class="card" href="up.html">
📤 Upload File
</a>

<a class="card" href="get.html">
📥 Get File
</a>

<a class="card" href="del.html">
🗑 Delete File
</a>

<a class="card" href="login.html">
🔀 cookie Tester
</a>

</div>

<div class="footer">
Local Testing Tools
</div>

</div>

</body>
</html>
