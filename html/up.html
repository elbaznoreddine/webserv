<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Upload Form</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family: "Segoe UI", sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#667eea,#764ba2);
}

.card{
    width:420px;
    padding:35px;
    border-radius:16px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    color:white;
}

.card h2{
    text-align:center;
    margin-bottom:25px;
    font-weight:600;
}

.input-group{
    margin-bottom:15px;
}

.input-group input,
.input-group textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.input-group textarea{
    resize:none;
    height:80px;
}

.file-input{
    color:white;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:10px;
    background:#ffffff;
    color:#333;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

small{
    opacity:0.8;
}
</style>
</head>

<body>

<div class="card">

<h2>Upload Form</h2>

<form action="/" method="POST" enctype="multipart/form-data">

<div class="input-group">
<input type="text" name="username" placeholder="Username">
</div>

<div class="input-group">
<input type="email" name="email" placeholder="Email">
</div>

<div class="input-group">
<textarea name="message" placeholder="Message"></textarea>
</div>

<div class="input-group">
<small>Select file</small>
<input class="file-input" type="file" name="file">
</div>

<div class="input-group">
<small>Select image</small>
<input class="file-input" type="file" name="image">
</div>

<button type="submit">Send Data</button>

</form>

</div>

</body>
</html>
